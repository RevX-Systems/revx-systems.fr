<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08141a">
  <title>Demande transmise — REVX Systems</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="REVX">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks-page { min-height: 100vh; background: #08151b; color: #fff; display: flex; flex-direction: column; }
    .thanks-header { border-bottom: 1px solid rgba(255,255,255,.10); padding: 24px clamp(24px,6vw,80px); }
    .thanks-header img { display: block; width: 160px; height: auto; }
    .thanks-main { flex: 1; display: grid; place-items: center; padding: 80px 24px; }
    .thanks-panel { width: min(100%, 690px); }
    .thanks-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: #9cadb3; margin-bottom: 24px; }
    .thanks-eyebrow::before { content: ''; display: inline-block; width: 32px; height: 2px; background: var(--green); vertical-align: middle; margin-right: 14px; }
    .thanks-title { font-size: clamp(36px, 6vw, 66px); line-height: 1.06; font-weight: 750; letter-spacing: -.035em; margin: 0 0 22px; }
    .thanks-title span { color: var(--green); }
    .thanks-copy { max-width: 52ch; color: #c8d5d8; line-height: 1.7; margin: 0 0 42px; }
    .thanks-links { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
    .thanks-links a { display: inline-block; text-decoration: none; font-weight: 650; }
    .thanks-home { background: var(--green); color: #08151b; padding: 15px 24px; }
    .thanks-back { color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 14px 23px; }
    .thanks-footer { color: #8799a0; font-size: 12px; text-align: center; padding: 28px; border-top: 1px solid rgba(255,255,255,.08); }
    @media (prefers-reduced-motion: no-preference) { .thanks-links a { transition: background .2s ease, transform .2s ease; } .thanks-links a:hover { transform: translateY(-2px); } }
  </style>
</head>
<body class="thanks-page">
  <header class="thanks-header"><a href="index.html" aria-label="Retour à l'accueil REVX Systems"><img src="assets/revx-logo-original.png" alt="REVX Systems"></a></header>
  <main class="thanks-main">
    <div class="thanks-panel">
      <p class="thanks-eyebrow">Contact professionnel</p>
      <h1 class="thanks-title">Demande transmise<span>.</span></h1>
      <p class="thanks-copy">Merci pour votre message. Votre demande a été envoyée à REVX Systems. Nous reviendrons vers vous après étude de votre besoin.</p>
      <div class="thanks-links"><a class="thanks-home" href="index.html">Retour à l’accueil →</a><a class="thanks-back" href="contact.html">Autre demande</a></div>
    </div>
  </main>
  <footer class="thanks-footer">© 2026 REVX Systems · Professionnels uniquement</footer>
</body>
</html>
